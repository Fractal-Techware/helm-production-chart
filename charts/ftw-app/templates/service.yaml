apiVersion: v1
kind: Service
metadata:
  name: {{ include "ftw-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ftw-app.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.service.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ftw-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ int .Values.service.port }}
      targetPort: http
      protocol: TCP
