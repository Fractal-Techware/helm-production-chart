suite: ftw-app serviceaccount
templates:
  - templates/serviceaccount.yaml
release:
  name: demo
  namespace: apps
capabilities:
  majorVersion: 1
  minorVersion: 35
tests:
  - it: creates a ServiceAccount without token automount
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false
      - equal:
          path: metadata.name
          value: demo-ftw-app
  - it: supports a custom name and annotations (e.g. IRSA / Workload Identity)
    set:
      serviceAccount.name: api
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/api
    asserts:
      - equal:
          path: metadata.name
          value: api
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::111122223333:role/api
  - it: renders nothing when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
